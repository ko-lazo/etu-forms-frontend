stages:
  - test_and_build
  - deploy

build-project:
  stage: test_and_build
  image: node:24
  cache:
    key: "node-cache"
    paths:
      - .npm/
  script:
    - npm ci --prefer-offline --no-audit --no-fund --cache .npm
    # test
    - npm run lint
    - npm run typecheck
    # build
    - npm run generate
    # compress build
    - tar -czf build.tar.gz -C .output/public .
  artifacts:
    paths:
      - build.tar.gz
    expire_in: 1 day

.ssh:
  image: alpine:3.22
  variables:
    SSH_OPTS: -o IdentitiesOnly=yes -o BatchMode=yes
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - chmod 600 "$SSH_PRIVATE_KEY_PROD"
    - ssh-keygen -y -f "$SSH_PRIVATE_KEY_PROD" > /dev/null
    - ssh-keyscan -p "$SSH_PORT" -H "$PROD_HOST" >> ~/.ssh/known_hosts 2>/dev/null

deploy-prod:
  extends: .ssh
  stage: deploy
  only:
    - master
  script:
    - scp -i "$SSH_PRIVATE_KEY_PROD" $SSH_OPTS -P "$SSH_PORT" build.tar.gz "$PROD_USER@$PROD_HOST:$APP_DIR/build.tar.gz"
    - |
      ssh -i "$SSH_PRIVATE_KEY_PROD" $SSH_OPTS -p "$SSH_PORT" "$PROD_USER@$PROD_HOST" bash -s -- "$APP_DIR" <<'REMOTE'
      set -euo pipefail
      cd "$1"
      mkdir -p .output
      rm -rf .output/public.new .output/public.old
      mkdir .output/public.new
      tar -xzf build.tar.gz -C .output/public.new
      rm build.tar.gz
      if [ -d .output/public ]; then mv .output/public .output/public.old; fi
      mv .output/public.new .output/public
      rm -rf .output/public.old
      REMOTE
